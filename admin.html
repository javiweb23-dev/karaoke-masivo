<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Karaoke Latino</title>
    <script>(function(){var d=(new URLSearchParams(location.search).get('dj')||'').trim().toLowerCase();var k=d?'color_personalizado_'+d:'color_personalizado';var c=localStorage.getItem(k);if(!c&&d)c=localStorage.getItem('color_personalizado');if(c)document.documentElement.style.setProperty('--primary-color',c);})();</script>
    <link rel="stylesheet" href="style.css">
    <style>
    :root { --primary-color: #111; }
    body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; }
    .header { 
        background-color: var(--primary-color); 
        text-align: center; 
        padding: 15px; 
        position: fixed; 
        top: 0; 
        width: 100%; 
        z-index: 1000; 
    }
    .lock-screen {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
    }
    .lock-box {
        width: calc(100% - 40px);
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .lock-box input {
        padding: 14px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #111;
        color: #fff;
        font-size: 18px;
        text-align: center;
    }
    .lock-box button {
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: var(--primary-color);
        color: #fff;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }
    .admin-container { 
        padding: 20px; 
        margin-top: 100px; 
    }
    .pedido-card {
        background: #1a1a1a;
        border-left: 5px solid var(--primary-color);
        padding: 20px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        border-radius: 0 10px 10px 0;
        gap: 14px;
    }
    .info { flex-grow: 1; }
    .info small { color: #888; }
    .info strong { color: var(--primary-color); font-size: 1.2em; }
    .info span { display: block; margin-top: 5px; font-size: 1.1em; }
    .usuario-linea {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
    }
    .contador-pedidos {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        height: 28px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--primary-color);
        color: #fff;
        font-size: 12px;
        font-weight: bold;
        line-height: 1;
    }
    .acciones {
        width: 180px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
    }
    .btn-avisar {
        background: var(--primary-color);
        color: #fff;
        border: none;
        padding: 18px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        font-size: 16px;
    }
    .btn-avisar.enviado {
        background: #ffc107;
        color: #000;
    }
    .btn-eliminar {
        background: #dc3545;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
    }
    .importer-section {
        margin-top: 18px;
        padding: 14px;
        background: #111;
        border: 1px solid #333;
        border-radius: 10px;
    }
    .config-toggle {
        margin-top: 18px;
        border: none;
        border-radius: 8px;
        padding: 12px;
        background: var(--primary-color);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }
    .config-panel {
        display: none;
    }
    .config-panel.visible {
        display: block;
    }
    .importer-section h3 {
        margin: 0 0 10px 0;
        color: var(--primary-color);
    }
    #catalogFile {
        width: 100%;
        color: #fff;
        display: none;
    }
    .dropzone {
        margin-top: 10px;
        border: 2px dashed var(--primary-color);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        color: #bbb;
        cursor: pointer;
    }
    .dropzone.dragover {
        background: rgba(255, 255, 255, 0.06);
    }
    #importStatus {
        margin-top: 10px;
        min-height: 20px;
        font-size: 14px;
    }
    .brand-section {
        margin-top: 18px;
        padding: 14px;
        background: #111;
        border: 1px solid #333;
        border-radius: 10px;
    }
    .brand-section h3 {
        margin: 0 0 10px 0;
        color: var(--primary-color);
    }
    .brand-grid {
        display: grid;
        gap: 10px;
    }
    #brandLogoInput {
        width: 100%;
        color: #fff;
    }
    .color-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    #brandColorInput {
        width: 56px;
        height: 36px;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
    }
    #brandLogoPreview {
        width: 100%;
        max-width: 220px;
        max-height: 90px;
        object-fit: contain;
        background: #000;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 6px;
    }
    #brandStatus {
        margin-top: 8px;
        min-height: 20px;
        font-size: 14px;
    }
    </style>
</head>
<body>
    <div class="lock-screen" id="lockScreen">
        <div class="lock-box">
            <input type="password" id="pinInput" placeholder="PIN de acceso" autocomplete="off">
            <button id="enterPinBtn">ENTRAR</button>
        </div>
    </div>
    <div class="header">
        <h1>PANEL DE CONTROL</h1>
    </div>

    <div class="admin-container">
        <div id="listaPedidos"></div>
        <button id="toggleConfigBtn" class="config-toggle">CONFIGURACION</button>
        <div id="configPanel" class="config-panel">
            <div id="importerSection" class="importer-section">
                <h3>Importar Catalogo</h3>
                <input type="file" id="catalogFile" accept=".csv,.xlsx,.xls">
                <div id="catalogDropzone" class="dropzone">Arrastra CSV o Excel aqui, o haz clic para seleccionar</div>
                <div id="importStatus"></div>
            </div>
            <div class="brand-section">
                <h3>Configuracion de Marca</h3>
                <div class="brand-grid">
                    <input type="file" id="brandLogoInput" accept="image/*">
                    <div class="color-row">
                        <label for="brandColorInput">Color principal</label>
                        <input type="color" id="brandColorInput" value="#ff6600">
                    </div>
                    <img id="brandLogoPreview" alt="Vista previa del logo" src="logo.png">
                    <div id="brandStatus"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://vqirrwlznzbooiwlksly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_V9S8NC_f7Pn0dms86m3OFw_X5ficboj';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const DEFAULT_PRIMARY_COLOR = '#ff6600';
        const adminContainer = document.querySelector('.admin-container');
        const lockScreen = document.getElementById('lockScreen');
        const pinInput = document.getElementById('pinInput');
        const enterPinBtn = document.getElementById('enterPinBtn');
        const toggleConfigBtn = document.getElementById('toggleConfigBtn');
        const configPanel = document.getElementById('configPanel');
        const catalogFile = document.getElementById('catalogFile');
        const catalogDropzone = document.getElementById('catalogDropzone');
        const importStatus = document.getElementById('importStatus');
        const brandLogoInput = document.getElementById('brandLogoInput');
        const brandColorInput = document.getElementById('brandColorInput');
        const brandLogoPreview = document.getElementById('brandLogoPreview');
        const brandStatus = document.getElementById('brandStatus');
        const currentDjId = detectDjIdFromUrl();
        let colorSaveTimer = null;
        let realtimeInitialized = false;

        function detectDjIdFromUrl() {
            const queryId = new URLSearchParams(window.location.search).get('dj');
            if (queryId) return queryId.trim().toLowerCase();
            return null;
        }

        function mostrarAlertaElegante(mensaje, tipo) {
            const accent = tipo === 'error'
                ? '#dc3545'
                : getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || DEFAULT_PRIMARY_COLOR;
            const modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100vw';
            modal.style.height = '100vh';
            modal.style.backgroundColor = 'rgba(0,0,0,0.85)';
            modal.style.display = 'flex';
            modal.style.justifyContent = 'center';
            modal.style.alignItems = 'center';
            modal.style.zIndex = '9999';
            modal.style.margin = '0';
            modal.style.padding = '0';
            modal.style.boxSizing = 'border-box';
            const box = document.createElement('div');
            box.style.backgroundColor = '#1a1a1a';
            box.style.padding = '25px';
            box.style.borderRadius = '12px';
            box.style.border = '2px solid ' + accent;
            box.style.textAlign = 'center';
            box.style.width = 'calc(100% - 40px)';
            box.style.maxWidth = '400px';
            box.style.boxSizing = 'border-box';
            box.style.color = 'white';
            box.style.boxShadow = '0 10px 25px rgba(255, 102, 0, 0.2)';
            box.style.margin = '0';
            const title = document.createElement('h3');
            title.innerText = '🎤 Karaoke Latino Dice:';
            title.style.color = accent;
            title.style.margin = '0 0 15px 0';
            const text = document.createElement('p');
            text.innerText = mensaje;
            text.style.whiteSpace = 'pre-line';
            text.style.fontSize = '16px';
            text.style.lineHeight = '1.5';
            text.style.wordBreak = 'break-word';
            text.style.margin = '0';
            const btn = document.createElement('button');
            btn.innerText = 'ACEPTAR';
            btn.style.backgroundColor = accent;
            btn.style.border = 'none';
            btn.style.padding = '12px 25px';
            btn.style.borderRadius = '8px';
            btn.style.marginTop = '20px';
            btn.style.cursor = 'pointer';
            btn.style.fontSize = '16px';
            btn.style.color = '#ffffff';
            btn.style.fontWeight = '800';
            btn.style.textTransform = 'uppercase';
            btn.style.letterSpacing = '1px';
            btn.onclick = () => {
                document.body.removeChild(modal);
            };
            box.appendChild(title);
            box.appendChild(text);
            box.appendChild(btn);
            modal.appendChild(box);
            document.body.appendChild(modal);
        }

        function setStatus(msg, isError) {
            importStatus.textContent = msg;
            importStatus.style.color = isError ? '#ff4d4f' : '#9be564';
        }

        function setBrandStatus(msg, isError) {
            brandStatus.textContent = msg;
            brandStatus.style.color = isError ? '#ff4d4f' : '#9be564';
        }

        function setBranding(primaryColor) {
            const color = /^#[0-9a-f]{6}$/i.test(String(primaryColor || '')) ? primaryColor : DEFAULT_PRIMARY_COLOR;
            document.documentElement.style.setProperty('--primary-color', color);
            if (currentDjId) localStorage.setItem('color_personalizado_' + currentDjId, color);
            else localStorage.setItem('color_personalizado', color);
            brandColorInput.value = color;
        }

        async function saveBranding(payload) {
            const { error } = await _supabase
                .from('usuarios_dj')
                .upsert([{ id_dj: currentDjId, ...payload }], { onConflict: 'id_dj' });
            return error;
        }

        async function loadBrandingByDj() {
            if (!currentDjId) return;
            const { data, error } = await _supabase
                .from('usuarios_dj')
                .select('logo_url, color_principal')
                .eq('id_dj', currentDjId)
                .limit(1)
                .maybeSingle();
            if (error || !data) {
                setBranding(DEFAULT_PRIMARY_COLOR);
                brandLogoPreview.src = 'logo.png';
                return;
            }
            setBranding(data.color_principal || DEFAULT_PRIMARY_COLOR);
            brandLogoPreview.src = data.logo_url || 'logo.png';
        }

        async function handleLogoUpload(file) {
            if (!file) return;
            const ext = (file.name.split('.').pop() || 'png').toLowerCase();
            const safeExt = ext.replace(/[^a-z0-9]/g, '') || 'png';
            const filePath = `${currentDjId}/logo-${Date.now()}.${safeExt}`;
            setBrandStatus('Subiendo logo...', false);
            const { error: uploadError } = await _supabase.storage
                .from('logos')
                .upload(filePath, file, { upsert: true });
            if (uploadError) {
                setBrandStatus('Error al subir logo: ' + uploadError.message, true);
                return;
            }
            const { data } = _supabase.storage.from('logos').getPublicUrl(filePath);
            const publicUrl = data && data.publicUrl ? data.publicUrl : '';
            if (!publicUrl) {
                setBrandStatus('No se pudo obtener la URL publica.', true);
                return;
            }
            const saveError = await saveBranding({ logo_url: publicUrl });
            if (saveError) {
                setBrandStatus('Error al guardar logo: ' + saveError.message, true);
                return;
            }
            brandLogoPreview.src = publicUrl;
            setBrandStatus('Logo actualizado correctamente.', false);
        }

        function setupBrandingControls() {
            brandLogoInput.addEventListener('change', async (e) => {
                const files = e.target.files || [];
                if (!files.length) return;
                await handleLogoUpload(files[0]);
                brandLogoInput.value = '';
            });
            brandColorInput.addEventListener('input', () => {
                const color = brandColorInput.value;
                setBranding(color);
                clearTimeout(colorSaveTimer);
                colorSaveTimer = setTimeout(async () => {
                    const saveError = await saveBranding({ color_principal: color });
                    if (saveError) {
                        setBrandStatus('Error al guardar color: ' + saveError.message, true);
                        return;
                    }
                    setBrandStatus('Color actualizado.', false);
                }, 200);
            });
        }

        function bloquearPorDjFaltante() {
            lockScreen.style.display = 'none';
            adminContainer.innerHTML = '<div style="padding:20px;background:#1a1a1a;border:1px solid #333;border-radius:10px;">Acceso bloqueado: falta el parametro ?dj= en la URL.</div>';
        }

        function desbloquearAdmin() {
            lockScreen.style.display = 'none';
            pinInput.value = '';
            pinInput.blur();
        }

        async function validarPin() {
            if (!currentDjId) {
                mostrarAlertaElegante('PIN Incorrecto', 'error');
                return;
            }
            const entered = pinInput.value.trim();
            const { data, error } = await _supabase
                .from('usuarios_dj')
                .select('pin_acceso')
                .eq('id_dj', currentDjId)
                .maybeSingle();
            if (error || !data) {
                mostrarAlertaElegante('PIN Incorrecto', 'error');
                pinInput.value = '';
                pinInput.focus();
                return;
            }
            const stored = String(data.pin_acceso ?? '').trim();
            if (stored === entered) {
                sessionStorage.setItem('admin_access_' + currentDjId, 'true');
                desbloquearAdmin();
                initRealtimeAndData();
                return;
            }
            mostrarAlertaElegante('PIN Incorrecto', 'error');
            pinInput.value = '';
            pinInput.focus();
        }

        function mapRowToSong(row) {
            const numero = String(row.numero || row.number || row.id || '').trim();
            const artista = String(row.artista || row.artist || '').trim();
            const titulo = String(row.titulo || row.title || '').trim();
            const genero = String(row.genero || row.genre || '').trim();
            const idioma = String(row.idioma || row.language || '').trim().toLowerCase();
            if (!numero || !artista || !titulo) return null;
            return {
                id_dj: currentDjId,
                numero,
                artista,
                titulo,
                genero,
                idioma: idioma || 'español'
            };
        }

        async function importarCancionesDesdeArchivo(file) {
            if (!currentDjId) {
                setStatus('No se detecto dj en la URL.', true);
                return;
            }
            setStatus('Procesando archivo...', false);
            let rows = [];
            try {
                const ext = (file.name.split('.').pop() || '').toLowerCase();
                if (ext === 'csv') {
                    const text = await file.text();
                    const wb = XLSX.read(text, { type: 'string' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                } else {
                    const buffer = await file.arrayBuffer();
                    const wb = XLSX.read(buffer, { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
            } catch (e) {
                setStatus('No se pudo leer el archivo.', true);
                return;
            }

            if (!rows.length) {
                setStatus('El archivo esta vacio.', true);
                return;
            }

            const songs = rows.map(mapRowToSong).filter(Boolean);
            if (!songs.length) {
                setStatus('No se encontraron canciones validas.', true);
                return;
            }

            const { error } = await _supabase.from('canciones').upsert(songs, {
                onConflict: 'id_dj,numero',
                ignoreDuplicates: false
            });
            if (error) {
                setStatus('Error al importar: ' + error.message, true);
                return;
            }
            setStatus(`Importacion completada. ${songs.length} canciones procesadas.`, false);
        }

        function setupImporter() {
            toggleConfigBtn.addEventListener('click', () => {
                configPanel.classList.toggle('visible');
            });
            catalogDropzone.addEventListener('click', () => catalogFile.click());
            ['dragenter', 'dragover'].forEach((eventName) => {
                catalogDropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    catalogDropzone.classList.add('dragover');
                });
            });
            ['dragleave', 'drop'].forEach((eventName) => {
                catalogDropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    catalogDropzone.classList.remove('dragover');
                });
            });
            catalogDropzone.addEventListener('drop', async (e) => {
                const files = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files : [];
                if (!files.length) return;
                await importarCancionesDesdeArchivo(files[0]);
            });
            catalogFile.addEventListener('change', async (e) => {
                const files = e.target.files || [];
                if (!files.length) return;
                await importarCancionesDesdeArchivo(files[0]);
                catalogFile.value = '';
            });
        }

        function initRealtimeAndData() {
            if (realtimeInitialized) return;
            realtimeInitialized = true;
            _supabase
                .channel('cambios-admin')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, (payload) => {
                    const sameDj =
                        (payload.new && payload.new.id_dj === currentDjId) ||
                        (payload.old && payload.old.id_dj === currentDjId);
                    if (sameDj) cargarPedidos();
                })
                .subscribe();
            cargarPedidos();
        }

        if (!currentDjId) {
            bloquearPorDjFaltante();
        } else {
            loadBrandingByDj();
            if (sessionStorage.getItem('admin_access_' + currentDjId) === 'true') {
                desbloquearAdmin();
                initRealtimeAndData();
            } else {
                pinInput.focus();
            }

            enterPinBtn.addEventListener('click', validarPin);
            pinInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') validarPin();
            });

            setupImporter();
            setupBrandingControls();
        }

        async function cargarPedidos() {
            if (!currentDjId) return;
            const { data, error } = await _supabase
                .from('solicitudes')
                .select('*')
                .eq('id_dj', currentDjId)
                .in('estado', ['pendiente', 'preparate'])
                .order('created_at', { ascending: true });

            if (error) return;

            let todasLasFilas = [];
            let rangoInicio = 0;
            const tamRango = 1000;
            let errorTotales = null;
            while (true) {
                const res = await _supabase
                    .from('solicitudes')
                    .select('id, nombre_usuario, created_at')
                    .eq('id_dj', currentDjId)
                    .order('id', { ascending: true })
                    .range(rangoInicio, rangoInicio + tamRango - 1);
                errorTotales = res.error;
                if (errorTotales) break;
                const trozo = res.data || [];
                todasLasFilas = todasLasFilas.concat(trozo);
                if (trozo.length < tamRango) break;
                rangoInicio += tamRango;
            }

            if (errorTotales) return;

            const porUsuario = {};
            todasLasFilas.forEach((fila) => {
                const clave = (fila.nombre_usuario || '').trim() || 'Sin nombre';
                if (!porUsuario[clave]) porUsuario[clave] = [];
                porUsuario[clave].push(fila);
            });
            Object.keys(porUsuario).forEach((clave) => {
                porUsuario[clave].sort((a, b) => {
                    const ta = new Date(a.created_at).getTime();
                    const tb = new Date(b.created_at).getTime();
                    if (ta !== tb) return ta - tb;
                    if (a.id < b.id) return -1;
                    if (a.id > b.id) return 1;
                    return 0;
                });
            });
            const ordenPorId = {};
            Object.keys(porUsuario).forEach((clave) => {
                porUsuario[clave].forEach((fila, indice) => {
                    ordenPorId[fila.id] = indice + 1;
                });
            });

            const contenedor = document.getElementById('listaPedidos');
            contenedor.innerHTML = '';

            (data || []).forEach((pedido) => {
                const nombreUsuario = (pedido.nombre_usuario || '').trim() || 'Sin nombre';
                const ordenPedido = ordenPorId[pedido.id] || 1;
                const div = document.createElement('div');
                div.className = 'pedido-card';
                const textoAvisar = pedido.estado === 'preparate' ? 'REENVIAR AVISO' : 'AVISAR';
                const claseAvisar = pedido.estado === 'preparate' ? 'btn-avisar enviado' : 'btn-avisar';

                div.innerHTML = `
                    <div class="info">
                        <small>${new Date(pedido.created_at).toLocaleTimeString()}</small><br>
                        <div class="usuario-linea">
                            <strong>${nombreUsuario}</strong>
                            <span class="contador-pedidos">#${ordenPedido}</span>
                        </div>
                        pide:<br>
                        <span>${pedido.cancion_info} (#${pedido.numero_cancion})</span>
                    </div>
                    <div class="acciones">
                        <button class="${claseAvisar}" onclick="avisarPedido(${pedido.id})">${textoAvisar}</button>
                        <button class="btn-eliminar" onclick="eliminarPedido(${pedido.id})">X</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        async function avisarPedido(id) {
            const { error } = await _supabase
                .from('solicitudes')
                .update({ estado: 'preparate' })
                .eq('id_dj', currentDjId)
                .eq('id', id);

            if (!error) cargarPedidos();
        }

        async function eliminarPedido(id) {
            if (!confirm('¿Eliminar pedido de la lista?')) return;
            const { error } = await _supabase
                .from('solicitudes')
                .update({ estado: 'completada' })
                .eq('id_dj', currentDjId)
                .eq('id', id);

            if (!error) cargarPedidos();
        }
        window.avisarPedido = avisarPedido;
        window.eliminarPedido = eliminarPedido;

    </script>
