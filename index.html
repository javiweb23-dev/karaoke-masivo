<!DOCTYPE html>
<html lang="es">
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Karaoke Latino</title>
    <link rel="icon" href="logo.png" type="image/png">
    <script>(function(){var d=(new URLSearchParams(location.search).get('dj')||'').trim().toLowerCase();var k=d?'color_personalizado_'+d:'color_personalizado';var c=localStorage.getItem(k);if(!c&&d)c=localStorage.getItem('color_personalizado');if(c)document.documentElement.style.setProperty('--primary-color',c);})();</script>
    <link rel="stylesheet" href="style.css?v=1.2">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            safelist: [
                'relative', 'w-full', 'flex', 'items-center', 'gap-1', 'gap-2', 'mt-3',
                'shrink-0', 'w-8', 'w-16', 'h-16', 'rounded-lg', 'bg-black/40', 'text-white',
                'hover:bg-white/10', 'transition-colors', 'opacity-30', 'pointer-events-none',
                'flex-1', 'min-w-0', 'overflow-x-auto', 'py-1', 'px-0.5', 'cursor-grab',
                'cursor-grabbing', 'select-none', 'border', 'border-[#444]', 'bg-[#252525]',
                'text-[#ccc]', 'text-[10px]', 'leading-tight', 'text-center', 'justify-center',
                'p-1', 'break-words', 'hyphens-auto', 'overflow-hidden', 'font-semibold',
                '[scrollbar-width:none]', '[-ms-overflow-style:none]', '[&::-webkit-scrollbar]:hidden'
            ]
        };
    </script>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="Logo" class="logo">
        <button type="button" id="openQrBtn" class="header-qr-btn" aria-label="Compartir código QR">
            <svg class="header-qr-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect width="5" height="5" x="7" y="7" rx="1"/><rect width="5" height="5" x="14" y="7" rx="1"/><rect width="5" height="5" x="7" y="14" rx="1"/></svg>
        </button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="BUSCAR POR TÍTULO, ARTISTA O NÚMERO...">
        <div id="genre-slider-root" aria-label="Filtrar por género"></div>
    </div>
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <h3>Comparte esta mesa</h3>
            <img id="qrImage" alt="QR para compartir">
            <button id="closeQrBtn" class="close-qr-btn">Cerrar</button>
        </div>
    </div>

    <div id="loading">Cargando canciones...</div>
    <div id="noResults" style="display:none;">No se encontraron resultados</div>

    <div id="lista-canciones" style="display: flex; flex-direction: column; width: 100%; max-width: 600px; margin: 0 auto;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="components/genre-slider.js"></script>
    <script src="app.js?v=4.0"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister().then(function(boolean) {
                        console.log('Service Worker viejo eliminado exitosamente.');
                    });
                }
            });
        }
    </script>
</body>
</html>
